name: macOS OCR tests

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    env:
      NDLOCR_DIR: ${{ runner.temp }}/ndlocr-lite-zotero
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text extractor
        run: command -v pdftotext || brew install poppler
      - name: Offline safety tests
        run: |
          node tests/review-defaults.js
          node tests/review-safety.js
          python3 -B tests/test_installer_safety.py
      - name: Install NDLOCR-Lite and run OCR integration tests
        run: node tests/plugin-harness.js
      - name: PDF geometry tests
        run: '"$NDLOCR_DIR/.venv/bin/python" -B tests/test_pdf_geometry.py'
