<vbox id="ndlocr-index-prefs">
	<groupbox>
		<html:h2>NDLOCR-Lite</html:h2>
		<description>初めて使うときは「セットアップ」で NDLOCR-Lite をインストールします（約 650MB をダウンロード。場所のパスは英数字のみ）。選んだ場所の中に ndlocr-lite-zotero フォルダを作り、終わると下の欄に自動で入ります。</description>
		<hbox align="center">
			<button id="ndlocr-index-setup" label="セットアップ…"/>
		</hbox>
		<checkbox preference="extensions.zotero.ndlocrindex.installLegacy"
			label="旧版の NDLOCR-Lite 1.4.0 も一緒にインストールする（2.0.0 で問題があったときの保険。約 160MB 追加。「使う NDLOCR-Lite の版」で切り替える）"/>
		<label value="インストール先フォルダ:"/>
		<hbox align="center">
			<html:input type="text" id="ndlocr-index-installDir" flex="1"
				preference="extensions.zotero.ndlocrindex.installDir"/>
			<button id="ndlocr-index-browse" label="参照…"/>
		</hbox>
		<hbox align="center">
			<button id="ndlocr-index-test" label="動作確認"/>
			<html:span id="ndlocr-index-status" style="white-space: pre-wrap; margin-inline-start: 8px;"/>
		</hbox>
		<hbox align="center">
			<label value="使う NDLOCR-Lite の版（インストール先にある版から選ぶ）:"/>
			<html:select id="ndlocr-index-version"/>
		</hbox>
	</groupbox>

	<groupbox>
		<html:h2>OCR</html:h2>
		<hbox align="center">
			<label value="PDF を画像にするときの解像度 DPI（既定 150。小さい文字が多い資料は 300）:"/>
			<html:input type="text" preference="extensions.zotero.ndlocrindex.dpi" style="width: 5em"/>
		</hbox>
		<hbox align="center">
			<label value="この文字数以上のテキストが既にある PDF は「テキストあり」としてスキップ:"/>
			<html:input type="text" preference="extensions.zotero.ndlocrindex.minChars" style="width: 5em"/>
		</hbox>
	</groupbox>

	<groupbox>
		<html:h2>透明テキスト付き PDF</html:h2>
		<description>OCR した文字を見えない層として重ねた PDF を作ると、PDF ビューアでの検索・ハイライト、文字の選択やコピーができるようになります。</description>
		<radiogroup preference="extensions.zotero.ndlocrindex.pdfOutput">
			<radio value="replace" label="元の PDF と差し替える（透明テキストを追記する。右クリック →「NDLOCR: 差し替えた PDF を元に戻す」でいつでも戻せる）"/>
			<radio value="attach" label="別の添付として追加する（元の PDF はそのまま）"/>
			<radio value="none" label="作らない（Zotero の全文インデックスへの登録だけ）"/>
		</radiogroup>
		<checkbox preference="extensions.zotero.ndlocrindex.backupOriginal"
			label="差し替える前の PDF を Zotero データフォルダの ndlocr-lite-backup にバックアップする"/>
	</groupbox>

	<groupbox>
		<html:h2>全文インデックス</html:h2>
		<checkbox preference="extensions.zotero.ndlocrindex.syncFulltext"
			label="OCR テキストを Zotero の同期でサーバーにも送る（他の端末でも検索できるようにする）"/>
		<checkbox preference="extensions.zotero.ndlocrindex.restoreOnReindex"
			label="再索引で OCR テキストが上書きされたら自動で戻す"/>
	</groupbox>
</vbox>
